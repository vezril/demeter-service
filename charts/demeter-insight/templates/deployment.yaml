apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "insight.fullname" . }}
  labels: {{- include "insight.labels" . | nindent 4 }}
spec:
  # Safe to scale, unlike the daily job: this service only reads, so two of it
  # cannot race each other or an upstream. Left at 1 because one is plenty.
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "insight.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}{{- toYaml . | nindent 8 }}{{- end }}
      labels: {{- include "insight.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: insight
          image: {{ include "insight.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: DEMETER_JDBC_URL
              value: {{ required "database.jdbcUrl is required -- there is deliberately no default, since a reader pointed at the wrong database returns plausible numbers about the wrong thing" .Values.database.jdbcUrl | quote }}
            - name: DEMETER_DB_USER
              value: {{ .Values.database.user | quote }}
            - name: DEMETER_INSIGHT_PORT
              value: {{ .Values.port | quote }}
            - name: JAVA_OPTS
              value: {{ .Values.javaOpts | quote }}
            {{- if .Values.database.watchPassword }}
            - name: DEMETER_WATCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "insight.fullname" . }}
                  key: DEMETER_WATCH_PASSWORD
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "insight.fullname" . }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          # /health, not /v1/runs/latest. Probing the data endpoint conflates
          # "can serve" with "has data": before the first daily run it answers
          # 404 and the pod never becomes Ready, so a working service is held
          # out of rotation until tomorrow morning. /health answers 200 when the
          # database is reachable and 503 when it is not, which is exactly the
          # state that should take a pod out of service.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # readOnlyRootFilesystem is on and the JVM still wants somewhere to
            # write (temp files, hsperfdata).
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
