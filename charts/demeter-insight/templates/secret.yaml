{{- /*
The database password lives here rather than in the Deployment's env block, so a
`kubectl get deploy -o yaml` while debugging does not print it to the terminal.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "insight.fullname" . }}
  labels: {{- include "insight.labels" . | nindent 4 }}
type: Opaque
stringData:
  DEMETER_DB_PASSWORD: {{ required "database.password is required" .Values.database.password | quote }}
  {{- with .Values.database.watchPassword }}
  DEMETER_WATCH_PASSWORD: {{ . | quote }}
  {{- end }}
