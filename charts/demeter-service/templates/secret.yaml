{{- /*
Every credential lands here rather than in the Deployment's env block, so a
`kubectl get deploy -o yaml` while debugging does not print the database
password and the MQTT credentials to the terminal.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "demeter.fullname" . }}
  labels: {{- include "demeter.labels" . | nindent 4 }}
type: Opaque
stringData:
  DEMETER_DB_PASSWORD: {{ if .Values.postgresql.enabled }}{{ required "postgresql.password is required when the bundled database is enabled" .Values.postgresql.password | quote }}{{ else }}{{ required "externalDatabase.password is required when postgresql.enabled is false" .Values.externalDatabase.password | quote }}{{ end }}
  {{- with .Values.config.sinks.mqtt.password }}
  DEMETER_MQTT_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.sinks.hermesmq.apiKey }}
  DEMETER_HERMES_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.enrichment.pcExpressApiKey }}
  DEMETER_PCEXPRESS_KEY: {{ . | quote }}
  {{- end }}
