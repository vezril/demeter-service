version = "3.8.3"
runner.dialect = scala213source3
# The codebase was authored at ~120 columns throughout. This was never enforced
# (there was no CI), so raising it to match the existing style keeps signatures
# and guard clauses on one line instead of reflowing 79 files.
maxColumn = 120
align.preset = more
rewrite.rules = [SortImports, RedundantBraces, RedundantParens]
# The codebase writes ScalaDoc in the aligned `*` style and hand-wraps prose so
# the score tables and worked examples in the comments line up. Asterisk style
# plus auto-wrapping reflowed all 94 files and destroyed that alignment, which
# is churn, not formatting. Match the code that exists.
docstrings.style = SpaceAsterisk
docstrings.wrap = no
trailingCommas = multiple
