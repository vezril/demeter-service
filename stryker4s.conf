# Default config. `sbt stryker` alone does NOT work in this multi-module build —
# stryker4s runs the CURRENT project's tests, and the root aggregate has no test
# framework, so every mutant reports NoCoverage. Use the script, which scopes the
# globs per module and switches the current project:
#
#   scripts/stryker.sh                 # every @pure module
#   scripts/stryker.sh normalization   # one module
#
# The @pure units (foundations + normalization) are the mutation targets per the
# spec suite; the boundary/IO modules are covered by @boundary tests instead.
stryker4s {
  mutate = [
    "modules/foundations/src/main/scala/**/*.scala"
    "modules/normalization/src/main/scala/**/*.scala"
  ]
  thresholds { high = 90, low = 85, break = 80 }
  reporters = ["console", "html"]
}
