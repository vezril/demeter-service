# Local Postgres for the persistence integration tests (03.x @boundary suites).
#   docker compose up -d postgres
# The suites skip themselves (ScalaTest `assume`) when this isn't running.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: demeter
      POSTGRES_PASSWORD: demeter
      POSTGRES_DB: demeter_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demeter -d demeter_test"]
      interval: 2s
      timeout: 2s
      retries: 15
