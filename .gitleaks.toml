[extend]
useDefault = true

# fixtures/ holds verbatim captured responses from Flipp's public flyer API,
# kept byte-exact so the decoder tests run against what the endpoint actually
# returns. Fields like
#
#   "thumbnail_hashed_key": "e58883dc-8473-11f1-be0c-8a607a8e5a80"
#
# are CDN image identifiers — public by construction and meaningless outside
# that CDN — but they trip the generic-api-key rule on entropy alone.
#
# All three conditions must hold together (condition = "AND"), so this exempts
# exactly that shape and nothing more: a private key, an AWS key, a JWT, or any
# other high-entropy string that is not a bare UUID still fails the scan even
# inside these same files. Scoping an allowlist to one rule needs gitleaks
# >= 8.19; the pinned version is in .github/workflows/ci.yml.
[[allowlists]]
description = "Public CDN image UUIDs in captured upstream API fixtures"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^fixtures/''']
regexes = ['''[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}''']
