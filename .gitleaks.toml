[extend]
useDefault = true

# The fixtures are verbatim captured responses from Flipp's public flyer API,
# kept byte-exact so decoder tests run against what the endpoint really returns.
# They trip the generic-api-key entropy heuristic on fields like
# "thumbnail_hashed_key": "e58883dc-8473-11f1-be0c-8a607a8e5a80" — a CDN image
# identifier, public by construction and useless outside that CDN.
#
# This exempts fixtures/ from ALL rules, not just the entropy heuristic, because
# the pinned gitleaks (8.18.4) cannot scope an allowlist to a single rule. That
# is a real gap: a genuine credential pasted into a fixture would not be caught.
# Everything else — modules/, scripts/, config, workflows — is still scanned, and
# fixtures should only ever contain recorded public responses.
[allowlist]
description = "Public CDN identifiers in captured upstream API fixtures"
paths = ['''^fixtures/''']
