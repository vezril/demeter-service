name: "Setup Scala build"
description: "JDK (Temurin 21), sbt, and Coursier/sbt caching — shared by all workflows."
runs:
  using: "composite"
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        distribution: temurin
        java-version: "21"

    - name: Set up sbt
      uses: sbt/setup-sbt@67d461eba2c4753196c230e02da850757ba4775e # v1

    - name: Cache Coursier and sbt
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/coursier
          ~/.sbt
          ~/.ivy2/cache
        key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt', 'project/**') }}
        restore-keys: |
          ${{ runner.os }}-sbt-
