name: "Setup Scala build"
description: "JDK (Temurin 21), sbt, and Coursier/sbt caching — shared by all workflows."
runs:
  using: "composite"
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: "21"

    - name: Set up sbt
      uses: sbt/setup-sbt@82da71df4e122282484a99a8d70096bc2369dbd8 # v1

    - name: Cache Coursier and sbt
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/coursier
          ~/.sbt
          ~/.ivy2/cache
        key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt', 'project/**') }}
        restore-keys: |
          ${{ runner.os }}-sbt-
