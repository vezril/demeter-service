name: Release

# Tag-triggered ONLY, deliberately. Publishing an image is an outward-facing act
# -- once a tag is pushed the artifact is public and cached by anyone who pulls
# it -- so it happens when you cut a version, never as a side effect of merging.
on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and publish image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Insight image tags
        id: meta-insight
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            suffix=-insight,onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          # The compile runs once on the native builder (the Dockerfile pins its
          # build stage to BUILDPLATFORM) because JVM bytecode is the same
          # everywhere; only the JRE base differs per arch. arm64 is here because
          # a NAS is as likely to be arm as amd64.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The read-only reader, from the same Dockerfile via build args so the
      # runtime notes (musl, launcher mode, bash) cannot drift between them.
      - name: Build and publish demeter-insight
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          build-args: |
            MODULE=insight
            LAUNCHER=demeter-insight
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-insight.outputs.tags }}
          labels: ${{ steps.meta-insight.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Publish the GitHub Release
    runs-on: ubuntu-latest
    # Only after the image exists. A Release whose notes point at a tag that has
    # no pullable image is worse than no Release at all -- it reads as done.
    needs: image
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compose the notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"

          # GitHub's own generator lists the merged PRs since the previous tag.
          # It is fetched separately rather than via `gh release create
          # --generate-notes`, so the deploy preamble below can sit ABOVE it
          # instead of being replaced by it.
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" \
            -q .body > /tmp/generated.md

          cat > /tmp/notes.md <<EOF
          \`\`\`bash
          helm upgrade --install demeter charts/demeter-service \\
            -n demeter --create-namespace -f my-values.yaml
          \`\`\`

          Image: \`ghcr.io/${GITHUB_REPOSITORY}:${VERSION}\` (linux/amd64, linux/arm64).

          The service binds no port: it wakes on its own schedule, writes a run
          report to the log, and pushes alerts outward to Home Assistant. Start
          from \`charts/demeter-service/values-nas.example.yaml\`; \`config.postalCode\`,
          \`postgresql.password\` and at least one alert sink are required. The
          watchlist lives in the database, not in the chart values.

          EOF
          cat /tmp/generated.md >> /tmp/notes.md

      - name: Create the Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md --verify-tag
