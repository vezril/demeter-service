name: CI

# Verifies every pull request targeting main: formatting,
# compilation, and the full test suite. Merging is blocked unless all required
# checks pass (branch protection).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only reads the repo (no package/image publish here).
permissions:
  contents: read

jobs:
  # Formatting is a separate job so a scalafmt violation fails independently of
  # the tests (a green test suite must not mask a format failure).
  format:
    name: Format (scalafmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-scala
      - name: Check formatting
        run: sbt -batch scalafmtCheckAll scalafmtSbtCheck

  build-test:
    name: Compile & test
    runs-on: ubuntu-latest
    # The persistence, watchlist and alerting @boundary suites talk to a real
    # PostgreSQL. Without one they CANCEL rather than fail — by design, so a
    # laptop without Docker stays green — which means a CI job with no database
    # would pass while silently skipping the tests that cover byte-exact
    # archival, idempotent upserts, and rebuild-from-raw. The service container
    # is what makes this gate mean anything.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: demeter
          POSTGRES_PASSWORD: demeter
          POSTGRES_DB: demeter_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U demeter -d demeter_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-scala
      - name: Compile
        run: sbt -batch compile Test/compile
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          # noformat: without it sbt wraps every line in ANSI colour even with
          # no TTY, so `[info]` arrives as \e[0m[\e[0m\e[0minfo\e[0m] and any
          # anchored match silently finds nothing.
          sbt -Dsbt.log.noformat=true -batch test 2>&1 | tee /tmp/test.log
      - name: Assert the database-backed tests actually ran
        shell: bash
        # A cancelled @boundary suite is invisible in an exit code: `assume`
        # raises TestCanceled, which ScalaTest reports as a non-failure. If the
        # service container were unreachable this job would go green having
        # skipped every test that touches Postgres — exactly the false green
        # this job exists to prevent, so make it an explicit failure.
        run: |
          if grep -Eq "canceled [1-9]" /tmp/test.log; then
            echo "::error::@boundary tests were cancelled — Postgres was unreachable, so this run proved nothing"
            grep -E "canceled [1-9]|CANCELED" /tmp/test.log
            exit 1
          fi
          # No summary at all means the suites never ran — also a false green.
          grep -E "Tests: succeeded" /tmp/test.log \
            || { echo "::error::no ScalaTest summary in the log — the suites did not run"; exit 1; }

  # Secret scanning — fail the PR if a credential was committed (language-agnostic).
  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan full history
      - name: gitleaks
        run: |
          V=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz" \
            | tar xz -C /tmp gitleaks
          /tmp/gitleaks git . --config .gitleaks.toml --redact --verbose

  # The chart and the Dockerfile are as capable of rotting as the Scala is, and
  # nothing else in this workflow would notice. Neither job needs a cluster:
  # rendering catches template and required-value errors, and the build catches
  # a Dockerfile that no longer produces an image.
  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Lint demeter-insight
        run: |
          helm lint charts/demeter-insight \
            --set database.jdbcUrl=jdbc:postgresql://db:5432/demeter \
            --set database.password=ci
      - name: The insight ingress class must be omitted when empty
        # k3s's Traefik silently ignores an Ingress naming a class it cannot
        # resolve; a rendered-empty class 404s while the object looks healthy.
        run: |
          helm template ci charts/demeter-insight \
            --set database.jdbcUrl=x --set database.password=ci \
            --set ingress.enabled=true --set ingress.host=ci.local > /tmp/insight.yaml
          if grep -q "ingressClassName" /tmp/insight.yaml; then
            echo "::error::empty ingress class was rendered rather than omitted"; exit 1
          fi
      - name: A missing database URL must fail the render
        run: |
          if helm template ci charts/demeter-insight --set database.password=ci >/dev/null 2>&1; then
            echo "::error::the chart rendered without a database URL"; exit 1
          fi
      - name: Lint
        run: |
          helm lint charts/demeter-service \
            --set config.postalCode=H2X1Y6 \
            --set postgresql.password=ci \
            --set config.sinks.ntfyUrl=https://ntfy.sh/ci
      - name: Render both database modes
        run: |
          helm template ci charts/demeter-service \
            --set config.postalCode=H2X1Y6 \
            --set postgresql.password=ci \
            --set config.sinks.ntfyUrl=https://ntfy.sh/ci > /tmp/bundled.yaml
          helm template ci charts/demeter-service \
            --set config.postalCode=H2X1Y6 \
            --set postgresql.enabled=false \
            --set externalDatabase.jdbcUrl=jdbc:postgresql://db:5432/demeter \
            --set externalDatabase.username=demeter \
            --set externalDatabase.password=ci \
            --set config.sinks.ntfyUrl=https://ntfy.sh/ci > /tmp/external.yaml
          grep -q "kind: StatefulSet" /tmp/bundled.yaml
          if grep -q "kind: StatefulSet" /tmp/external.yaml; then
            echo "::error::postgresql.enabled=false still rendered a StatefulSet"; exit 1
          fi
      - name: A missing postal code must fail the render, not deploy silently
        run: |
          if helm template ci charts/demeter-service --set postgresql.password=ci \
               --set config.sinks.ntfyUrl=https://ntfy.sh/ci >/dev/null 2>&1; then
            echo "::error::chart rendered without a postal code; the required guard is gone"; exit 1
          fi

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The launcher must be executable by a non-root user
        # This is the bug a `docker run` smoke test missed and a Kubernetes
        # securityContext caught: native-packager stages the launcher 0744, and
        # the pod dies on "permission denied" before the JVM starts.
        run: |
          docker build -q -t demeter-ci:check . >/dev/null
          MODE=$(docker run --rm --entrypoint stat demeter-ci:check -c '%A' /opt/demeter/bin/demeter-orchestration)
          echo "mode: $MODE"
          case "$MODE" in
            *x*x*x) echo "executable by others" ;;
            *) echo "::error::launcher is $MODE -- a non-root container cannot exec it"; exit 1 ;;
          esac
      - name: The insight image builds and starts too
        # Both services come from one Dockerfile via --build-arg. Reaching its
        # own config error proves the JVM booted and the right main ran.
        run: |
          docker build -q --build-arg MODULE=insight --build-arg LAUNCHER=demeter-insight \
            -t demeter-ci:insight . >/dev/null
          OUT=$(docker run --rm demeter-ci:insight 2>&1 | head -3 || true)
          echo "$OUT"
          echo "$OUT" | grep -q "DEMETER_JDBC_URL is not set" \
            || { echo "::error::the insight image did not reach its own config validation"; exit 1; }
      - name: The JVM must actually start under the pod's constraints
        # Building an image proves it builds, not that it runs. A v0.1.0 image
        # built and pushed cleanly and then failed on the target cluster with
        # "No java installations was detected", because the JVM could not create
        # threads and `java -version` printed nothing. Reaching the config error
        # proves the JVM booted and the application's own main ran.
        run: |
          OUT=$(docker run --rm --read-only --user 10001:10001 --tmpfs /tmp \
                  demeter-ci:check 2>&1 | head -5 || true)
          echo "$OUT"
          if ! echo "$OUT" | grep -q "config error"; then
            echo "::error::the image did not reach its own config validation -- the JVM never started"
            exit 1
          fi

  # The mutation gate answers a question the test count cannot: do the suites
  # actually kill a mutant, or do they merely execute the line? It went unrun
  # across an sbt 1.10 -> 1.13 bump precisely because nothing here enforced it.
  #
  # A matrix rather than one job looping both modules: scripts/stryker.sh writes
  # its report to a single target/stryker4s-report at the build root, so a loop
  # would leave only the last module's report behind. Separate jobs also say
  # which module regressed without reading the log.
  mutation:
    name: Mutation (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The @pure modules are the only mutation targets; the boundary/IO
        # modules are covered by @boundary tests against a real Postgres instead.
        module: [foundations, normalization]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-scala
      - name: Mutation gate
        # The script scopes the mutate globs to one module and switches sbt's
        # current project, both of which stryker4s 0.16.1 requires in a
        # multi-module build. It fails the run below the break threshold (80).
        run: scripts/stryker.sh ${{ matrix.module }}
      - name: Publish the HTML report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report-${{ matrix.module }}
          path: target/stryker4s-report
          if-no-files-found: warn
          retention-days: 14
